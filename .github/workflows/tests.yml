name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zakascore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zakascore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zakascore_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zakascore_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize test database
        working-directory: backend
        run: python -m scripts.init_db

      - name: Run tests
        working-directory: backend
        run: python -m pytest
